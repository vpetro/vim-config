  color: var(--fg);
  font-family: var(--sans);
  line-height: 1.6;
}
main {
  display: flow-root;
  box-sizing: content-box;
  max-width: var(--measure);
  margin-inline: auto;
  padding-block: 4rem 8rem;
  padding-inline: var(--gutter);
}

h1, h2, h3, h4, h5, h6 {
  line-height: 1.25;
  margin-block: 2em 0.6em;
  font-weight: 700;
  text-wrap: balance;
}

h3 { font-size: 1.2rem; color: var(--h3); }
h4 { font-size: 1.05rem; color: var(--h4); }
h5 { font-size: 1rem; color: var(--h5); }
h6 { font-size: 0.95rem; color: var(--h6); }

p, ul, ol, dl, pre, table, blockquote, figure, div.sourceCode { margin-block: 0 1.1em; }
p, li, dd, blockquote, figcaption { text-wrap: pretty; overflow-wrap: break-word; }
ul, ol { padding-inline-start: 1.5em; }
li + li { margin-block-start: 0.25em; }
li > :is(ul, ol) { margin-block: 0.25em 0; }
li::marker { color: var(--bullet); }
ul.task-list { list-style: none; padding-inline-start: 0.4em; }
.task-list input { margin: 0 0.55em 0 0; accent-color: var(--checked); pointer-events: none; vertical-align: -1px; }
li:has(> label > input:checked) { color: var(--fg-muted); }

a { color: var(--link); text-decoration: none; border-block-end: 1px solid color-mix(in srgb, var(--link) 35%, transparent); overflow-wrap: anywhere; }
a:hover { border-block-end-color: var(--link); }

strong { color: var(--strong); font-weight: 700; }
del { color: var(--fg-muted); }
img { max-width: 100%; height: auto; }
hr { border: 0; border-block-start: 1px solid var(--line); margin-block: 2.5em; }

blockquote {
  margin-inline: 0;
  padding: 0.2em 0 0.2em 1em;
  border-inline-start: 3px solid var(--line);
  color: var(--fg-muted);
  font-style: italic;
}
blockquote > :last-child { margin-block-end: 0; }

code { font-family: var(--mono); font-size: 0.9em; }
:not(pre) > code { color: var(--code); background: var(--panel); padding: 0.1em 0.35em; border-radius: 4px; }
pre {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0.9rem 1rem;
  overflow-x: auto;
  line-height: 1.5;
}
pre code { font-size: 0.85rem; }
div.sourceCode pre { margin: 0; }
code span.kw, code span.cf, code span.im, code span.pp { color: var(--kw); }
code span.st, code span.vs, code span.ss, code span.ch { color: var(--st); }
code span.co, code span.do, code span.an, code span.cv, code span.in { color: var(--co); font-style: italic; }
code span.fu, code span.bu, code span.ex { color: var(--fu); }
code span.dv, code span.bn, code span.fl, code span.cn { color: var(--dv); }
code span.dt, code span.at { color: var(--dt); }
code span.op { color: var(--fg-muted); }

pre.mermaid { background: none; border: 0; padding: 0; text-align: center; font-family: var(--sans); line-height: normal; }
pre.mermaid svg { max-width: 100%; height: auto; }
pre.mermaid p { margin: 0; text-wrap: initial; }
pre.mermaid svg .node rect.basic { rx: 5px; ry: 5px; }
pre.mermaid svg .cluster rect { rx: 8px; ry: 8px; }
pre.mermaid svg .cluster-label span p {
  background-color: var(--dg-cluster) !important;
  color: var(--dg-text-2);
  font-size: 0.85em;
  letter-spacing: 0.02em;
  padding: 0 0.6em;
  margin: 0 -0.6em;
  border-radius: 4px;
}
pre.mermaid svg .edgeLabel,
pre.mermaid svg .edgeLabel p { background-color: transparent !important; }
pre.mermaid svg .edgeLabel p {
  background-color: color-mix(in srgb, var(--bg) 88%, transparent) !important;
  color: var(--dg-text-2);
  font-size: 0.92em;
  padding: 0.05em 0.45em;
  margin: -0.05em -0.45em;
  border-radius: 4px;
}
main > pre.mermaid, main > .annotated > pre.mermaid {
  --bleed: max(0px, min(var(--measure) * 0.4, 50vw - 50% - var(--gutter)));
  margin-inline: calc(-1 * var(--bleed));
}

table { border-collapse: collapse; min-width: 100%; font-size: 0.95em; font-variant-numeric: tabular-nums; }
th, td { padding: 0.5em 0.75em; text-align: start; vertical-align: top; }
th { background: var(--panel); font-weight: 700; text-wrap: balance; border-block-end: 1px solid var(--line); }
tbody tr:nth-child(even) { background: var(--row-alt); }

div.sourceCode { display: flow-root; }

section.footnotes { font-size: 0.9em; color: var(--fg-muted); }

div.note, div.tip, div.important, div.warning, div.caution {
  margin-block: 0 1.1em;
  padding: 0.6rem 1rem 0.7rem;
  border-inline-start: 3px solid var(--line);
  border-radius: 0 6px 6px 0;
  background: var(--panel);
}
:is(div.note, div.tip, div.important, div.warning, div.caution) > .title {
  font: 700 0.68rem/1 var(--mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-block-end: 0.35rem;
}
:is(div.note, div.tip, div.important, div.warning, div.caution) > .title p { margin: 0; }
:is(div.note, div.tip, div.important, div.warning, div.caution) > :last-child { margin-block-end: 0; }
div.warning, div.caution { border-inline-start-color: var(--fu); }
div.tip { border-inline-start-color: var(--st); }
div.important { border-inline-start-color: var(--h2); }

.annotated { margin-block: 0 1.1em; }
body:not(.no-notes) .annotated > :not(.notes) { margin-block-end: 0; }
li > .annotated { margin-block-end: 0; }
.notes > div.pv { margin-block: 0.7em 0; }
body.no-notes .annotated { display: contents; }
body.no-notes main .pv, body.no-notes main .notes { display: none; }

div.pv {
  margin-block: 0.9em 1.1em;
  padding: 0.6rem 1rem 0.7rem;
  border-inline-start: 3px solid var(--note-accent);
  border-radius: 0 6px 6px 0;
  background: var(--note-bg);
  color: var(--note-fg);
  font-style: normal;
  font-size: 0.88rem;
  line-height: 1.5;
  text-wrap: pretty;
}
div.pv.collapsed > div.pv { display: none; }
button.replies {
  all: unset;
  cursor: pointer;
  display: block;
  margin-block-start: 0.55rem;
  font: 700 0.68rem/1 var(--mono);
  letter-spacing: 0.1em;
  color: var(--note-accent);
}
button.replies::before { content: "\25B8"; margin-inline-end: 0.4em; }
div.pv:not(.collapsed) > button.replies::before { content: "\25BE"; }
button.replies:hover { text-decoration: underline; }
div.pv div.pv {
  margin: 0.7rem 0 0 0.15rem;
  padding: 0.1rem 0 0.1rem 0.85rem;
  border-inline-start-width: 2px;
  border-radius: 0;
  background: none;
  font-size: inherit;
  line-height: inherit;
}
div.pv::before, span.pv::before {
  content: attr(data-tag);
  font: 700 0.68rem/1 var(--mono);
  letter-spacing: 0.1em;
  color: var(--note-accent);
}
div.pv::before { display: block; margin-block-end: 0.35rem; }
div.pv > :first-child { margin-block-start: 0; }
div.pv > :last-child { margin-block-end: 0; }
div.pv > p { margin-block-end: 0.7em; }
div.pv code { font-size: 0.88em; }
li > div.pv { margin-block: 0.5em; }
span.pv {
  padding: 0.08em 0.4em;
  border-radius: 4px;
  background: var(--note-bg);
  color: var(--note-fg);
  box-shadow: inset 0 -2px 0 var(--note-accent);
}
span.pv::before { margin-inline-end: 0.35em; }
span.pv span.pv { margin-inline-start: 0.2em; }
.pv[data-who="1"] { --note-accent: var(--h2); }
.pv[data-who="2"] { --note-accent: var(--h4); }
.pv[data-who="3"] { --note-accent: var(--h1); }
.pv.current { outline: 2px solid var(--note-accent); outline-offset: 3px; }

.toolbar {
  position: fixed;
  top: 0.75rem;
  right: 0.75rem;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.25rem 0.4rem;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  font: 500 0.75rem/1 var(--mono);
  color: var(--fg-muted);
  user-select: none;
}
.toolbar button {
  all: unset;
  cursor: pointer;
  padding: 0.3rem 0.45rem;
  border-radius: 5px;
  color: var(--fg);
  font: inherit;
}
.toolbar button:hover { background: var(--line); }
.toolbar .notes { display: flex; align-items: center; gap: 0.1rem; }
.toolbar [hidden] { display: none; }
.toolbar .notes-pos { color: var(--note-accent); font-weight: 700; padding: 0 0.3rem; }
.toolbar .sep { width: 1px; height: 1rem; background: var(--line); }
@media print {
  @page {
    size: letter;
    margin: 0.8in 0.75in 0.9in;
    @bottom-center { content: counter(page); font: 8pt ui-monospace, Menlo, monospace; color: #6E6E6E; }
  }
  :root { --measure: 58ch; --gutter: 0rem; }
  * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  html { font-size: 11pt; background: #fff; }
  body { line-height: 1.45; background: #fff; }
  main { padding: 0; }
  .toolbar { display: none; }
  h1, h2, h3, h4, h5, h6 { break-after: avoid; }
  h2 { margin-block-start: 1.6em; }
  p, li, div.pv { orphans: 3; widows: 3; }
  pre, table, figure, img, blockquote, div.sourceCode { break-inside: avoid; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; overflow: visible; }
  pre.mermaid { break-inside: avoid; }
  pre.mermaid svg { max-width: 100% !important; width: auto !important; height: auto; }
  .annotated > .notes { break-before: avoid; }
  .notes > div.pv:first-child { break-before: avoid; }
  div.pv > :first-child { break-before: avoid; }
  div.pv.collapsed > div.pv { display: block; }
  button.replies { display: none; }
  .pv.current { outline: none; }
}
</style>
</head>
<body>
<nav class="toolbar">
  <span class="notes" hidden>
    <button class="prev" title="previous note (p)">&lsaquo;</button>
    <span class="notes-pos"></span>
    <button class="next" title="next note (n)">&rsaquo;</button>
    <button class="fold" title="expand or collapse every thread (e)"></button>
    <button class="hide" title="hide or show the notes (h)"></button>
    <span class="sep"></span>
  </span>
  <button class="theme" title="toggle light/dark"></button>
</nav>
<main>
$if(title)$
<header class="doc">
<h1>$title$</h1>
$if(id)$
<p class="meta"><span>$id$</span>$if(status)$<span>$status$</span>$endif$$if(date)$<span>$date$</span>$endif$</p>
$endif$
</header>
$endif$
$body$
</main>
$if(mermaid)$
<script src="file://$mermaid$"></script>
$endif$
<script>
(function () {
  var root = document.documentElement;
  var themeBtn = document.querySelector(".toolbar .theme");
  var notesBox = document.querySelector(".toolbar .notes");
  var pos = document.querySelector(".toolbar .notes-pos");
  var prevBtn = notesBox.querySelector(".prev");
  var nextBtn = notesBox.querySelector(".next");
  var foldBtn = notesBox.querySelector(".fold");
  var hideBtn = notesBox.querySelector(".hide");
  var notes = Array.prototype.slice.call(document.querySelectorAll(".pv"));
  var threads = Array.prototype.slice.call(document.querySelectorAll("div.pv")).filter(function (n) {
    return !n.parentElement.closest(".pv") && n.querySelector(".pv");
  });
  var diagrams = Array.prototype.slice.call(document.querySelectorAll("pre.mermaid"));
  var idx = -1;
  var page = location.pathname;

  function remember(key, value) {
    try {
      if (value === null) sessionStorage.removeItem(key + ":" + page);
      else sessionStorage.setItem(key + ":" + page, value);
    } catch (e) {}
  }
  function recall(key) {
    try { return sessionStorage.getItem(key + ":" + page); } catch (e) { return null; }
  }

  var open = {};
  try { JSON.parse(recall("mdv-open") || "[]").forEach(function (k) { open[k] = true; }); } catch (e) {}

  function keyOf(thread) {
    var text = "";
    Array.prototype.forEach.call(thread.childNodes, function (c) {
      if (c.nodeType === 1 && (c.classList.contains("pv") || c.classList.contains("replies"))) return;
      text += c.textContent;
    });
    return thread.dataset.tag + "|" + text.replace(/\s+/g, " ").trim().slice(0, 80);
  }

  function setOpen(thread, on) {
    thread.classList.toggle("collapsed", !on);
    thread.querySelector(":scope > .replies").setAttribute("aria-expanded", on ? "true" : "false");
    if (on) open[keyOf(thread)] = true;
    else delete open[keyOf(thread)];
    remember("mdv-open", JSON.stringify(Object.keys(open)));
    paintNotesBar();
  }

  function allOpen() {
    return threads.every(function (t) { return !t.classList.contains("collapsed"); });
  }

  function notesHidden() { return document.body.classList.contains("no-notes"); }

  function setNotesHidden(on) {
    document.body.classList.toggle("no-notes", on);
    remember("mdv-notes-hidden", on ? "1" : null);
    paintNotesBar();
  }

  function paintNotesBar() {
    var hidden = notesHidden();
    prevBtn.hidden = nextBtn.hidden = pos.hidden = hidden;
    foldBtn.hidden = hidden || !threads.length;
    foldBtn.textContent = allOpen() ? "collapse" : "expand";
    hideBtn.textContent = hidden ? "show notes" : "hide";
  }

  function threadOf(note) {
    var t = note, p;
    while ((p = t.parentElement && t.parentElement.closest(".pv"))) t = p;
    return t;
  }

  diagrams.forEach(function (d) { d.dataset.src = d.textContent; });

  function isDark() { return root.dataset.theme === "dark"; }

  function diagramConfig() {
    var css = getComputedStyle(root);
    var v = function (name) { return css.getPropertyValue(name).trim(); };
    var font = getComputedStyle(document.body).fontFamily;
    return {
      startOnLoad: false,
      theme: "base",
      look: "classic",
      fontFamily: font,
      themeVariables: {
        darkMode: isDark(),
        background: v("--bg"),
        fontFamily: font,
        fontSize: "15px",
        primaryColor: v("--dg-fill"),
        primaryTextColor: v("--dg-text"),
        primaryBorderColor: v("--dg-border"),
        secondaryColor: v("--dg-alt"),
        secondaryTextColor: v("--dg-text"),
        secondaryBorderColor: v("--dg-border"),
        tertiaryColor: v("--dg-cluster"),
        tertiaryTextColor: v("--fg-muted"),
        tertiaryBorderColor: v("--dg-cluster-border"),
        textColor: v("--dg-text"),
        lineColor: v("--dg-line"),
        mainBkg: v("--dg-fill"),
        nodeBorder: v("--dg-border"),
        nodeTextColor: v("--dg-text"),
        clusterBkg: v("--dg-cluster"),
        clusterBorder: v("--dg-cluster-border"),
        titleColor: v("--fg-muted"),
        edgeLabelBackground: v("--bg"),
        noteBkgColor: v("--note-bg"),
        noteTextColor: v("--note-fg"),
        noteBorderColor: v("--note-accent"),
        actorBkg: v("--dg-fill"),
        actorBorder: v("--dg-border"),
        actorTextColor: v("--dg-text"),
        actorLineColor: v("--dg-cluster-border"),
        signalColor: v("--dg-line"),
        signalTextColor: v("--dg-text"),
        labelBoxBkgColor: v("--dg-cluster"),
        labelBoxBorderColor: v("--dg-border"),
        labelTextColor: v("--dg-text"),
        loopTextColor: v("--fg-muted"),
        activationBkgColor: v("--dg-alt"),
        activationBorderColor: v("--dg-border"),
        sequenceNumberColor: v("--bg"),
        labelColor: v("--dg-text"),
        altBackground: v("--dg-cluster")
      },
      flowchart: {
        curve: "bumpX",
        nodeSpacing: 50,
        rankSpacing: 55,
        padding: 15,
        diagramPadding: 12,
        subGraphTitleMargin: { top: 6, bottom: 6 },
        useMaxWidth: true
      },
      sequence: { useMaxWidth: true },
      state: { useMaxWidth: true },
      suppressErrorRendering: true
    };
  }

  function withCurve(src) {
    if (/^\s*(---|%%\{)/.test(src)) return src;
    var m = /^\s*(?:flowchart|graph)(?:\s+(LR|RL|TB|TD|BT))?\b/.exec(src);
    if (!m) return src;
    var curve = (m[1] === "LR" || m[1] === "RL") ? "bumpX" : "bumpY";
    return '%%{init: {"flowchart": {"curve": "' + curve + '"}}}%%\n' + src;
  }

  function fitDiagrams() {
    diagrams.forEach(function (d) {
      var svg = d.querySelector("svg");
      if (!svg || !svg.viewBox || !svg.viewBox.baseVal.width) return;
      var natural = svg.viewBox.baseVal.width;
      if (natural > d.clientWidth * 1.3) {
        svg.style.maxWidth = "none";
        svg.style.width = natural + "px";
      }
    });
  }

  function drawDiagrams() {
    if (!window.mermaid || !diagrams.length) return;
    diagrams.forEach(function (d) {
      d.removeAttribute("data-processed");
      d.textContent = withCurve(d.dataset.src);
    });
    mermaid.initialize(diagramConfig());
    mermaid.run({ nodes: diagrams, suppressErrors: true }).then(fitDiagrams);
  }

  function paintTheme() {
    themeBtn.textContent = isDark() ? "\u2600 light" : "\u263E dark";
  }

  themeBtn.addEventListener("click", function () {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("mdv-theme", root.dataset.theme); } catch (e) {}
    paintTheme();
    drawDiagrams();
  });

  function goTo(i) {
    idx = (i + notes.length) % notes.length;
    if (notesHidden()) setNotesHidden(false);
    var thread = threadOf(notes[idx]);
    if (thread !== notes[idx] && thread.classList.contains("collapsed")) setOpen(thread, true);
    notes.forEach(function (n, k) { n.classList.toggle("current", k === idx); });
    notes[idx].scrollIntoView({ block: "center", behavior: "smooth" });
    pos.textContent = (idx + 1) + "/" + notes.length;
  }

  if (notes.length) {
    threads.forEach(function (t) {
      var count = t.querySelectorAll(".pv").length;
      var btn = document.createElement("button");
      btn.className = "replies";
      btn.textContent = count + (count === 1 ? " reply" : " replies");
      btn.addEventListener("click", function () { setOpen(t, t.classList.contains("collapsed")); });
      t.insertBefore(btn, t.querySelector(":scope > .pv"));
      setOpen(t, !!open[keyOf(t)]);
    });
    setNotesHidden(recall("mdv-notes-hidden") === "1");
    notesBox.hidden = false;
    pos.textContent = notes.length + (notes.length === 1 ? " note" : " notes");
    nextBtn.addEventListener("click", function () { goTo(idx + 1); });
    prevBtn.addEventListener("click", function () { goTo(idx - 1); });
    foldBtn.addEventListener("click", function () {
      var on = !allOpen();
      threads.forEach(function (t) { setOpen(t, on); });
    });
    hideBtn.addEventListener("click", function () { setNotesHidden(!notesHidden()); });
    document.addEventListener("keydown", function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "n") goTo(idx + 1);
      if (e.key === "p") goTo(idx - 1);
      if (e.key === "e") foldBtn.click();
      if (e.key === "h") hideBtn.click();
    });
  }

  paintTheme();
  drawDiagrams();
})();
</script>
$if(stampfile)$
<script>
(function () {
  var current = "$stamp$";
  var pending = false;
  function check() {
    if (pending) return;
    pending = true;
    var s = document.createElement("script");
    s.src = "file://$stampfile$?t=" + Date.now();
    s.onload = s.onerror = function () {
      pending = false;
      s.remove();
      if (window.__mdvStamp && window.__mdvStamp !== current) location.reload();
    };
    document.head.appendChild(s);
  }
  setInterval(check, 1000);
})();
</script>
